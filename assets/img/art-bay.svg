<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="60%" stop-color="#f8f1ec"/>
      <stop offset="100%" stop-color="#f0e5dd"/>
    </radialGradient>
    <radialGradient id="glow" cx="26%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#edc3cb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#edc3cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="82%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#8fa887" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#8fa887" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <rect width="1000" height="1000" fill="url(#leaf)"/>
  <g stroke="#b05467" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="720" cy="240" r="88" fill="#b05467" opacity=".12" stroke="none"/>
    <circle cx="720" cy="240" r="88" stroke-opacity=".35" stroke-width="4"/>
    <!-- headland + pier -->
    <path d="M0 520c120-14 190-58 268-58 62 0 96 26 150 26" stroke-opacity=".35" stroke-width="5"/>
    <path d="M640 470h300" stroke-opacity=".45" stroke-width="6"/>
    <g stroke-opacity=".3" stroke-width="4">
      <path d="M680 470v70M740 470v70M800 470v70M860 470v70M920 470v70"/>
    </g>
    <!-- lighthouse -->
    <path d="M596 470l14-140h36l14 140z" fill="#ffffff" stroke-opacity=".6" stroke-width="5"/>
    <path d="M604 360h44" stroke-opacity=".5" stroke-width="4"/>
    <path d="M610 330h32v-26h-32z" stroke-opacity=".7" stroke-width="4" fill="#edc3cb" fill-opacity=".3"/>
    <!-- sea -->
    <g stroke-opacity=".3" stroke-width="5">
      <path d="M40 600c40-22 80-22 120 0s80 22 120 0 80-22 120 0 80 22 120 0 80-22 120 0 80 22 120 0"/>
      <path d="M-20 690c40-22 80-22 120 0s80 22 120 0 80-22 120 0 80 22 120 0 80-22 120 0 80 22 120 0"/>
      <path d="M40 780c40-22 80-22 120 0s80 22 120 0 80-22 120 0 80 22 120 0 80-22 120 0 80 22 120 0"/>
      <path d="M-20 870c40-22 80-22 120 0s80 22 120 0 80-22 120 0 80 22 120 0 80-22 120 0 80 22 120 0"/>
    </g>
    <!-- gulls -->
    <g stroke-opacity=".5" stroke-width="5">
      <path d="M180 250c22-22 34-22 52 0M232 250c22-22 34-22 52 0"/>
      <path d="M330 170c16-16 24-16 38 0M368 170c16-16 24-16 38 0"/>
    </g>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
