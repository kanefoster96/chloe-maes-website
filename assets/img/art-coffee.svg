<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#241a1d"/>
      <stop offset="55%" stop-color="#171214"/>
      <stop offset="100%" stop-color="#0d0a0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c98793" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#c98793" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cad2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#f3cad2" stop-opacity=".04"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g stroke="#f3cad2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="500" cy="500" r="330" stroke-opacity=".16" stroke-width="3"/>
    <circle cx="500" cy="500" r="268" stroke-opacity=".3" stroke-width="6" fill="#171214"/>
    <circle cx="500" cy="500" r="238" stroke-opacity=".18" stroke-width="3"/>
    <!-- crema -->
    <circle cx="500" cy="500" r="222" fill="#c98793" fill-opacity=".16" stroke="none"/>
    <!-- rosetta -->
    <g stroke-opacity=".92" stroke-width="7" fill="none">
      <path d="M500 318c0 60-6 210-6 270"/>
      <path d="M494 640c26-16 46-38 54-64-24 4-44 18-54 34"/>
      <path d="M494 640c-26-16-46-38-54-64 24 4 44 18 54 34"/>
      <path d="M497 560c34-14 60-38 70-70-30 2-56 20-70 44"/>
      <path d="M497 560c-34-14-60-38-70-70 30 2 56 20 70 44"/>
      <path d="M499 470c40-14 70-42 82-80-34 2-66 24-82 52"/>
      <path d="M499 470c-40-14-70-42-82-80 34 2 66 24 82 52"/>
      <path d="M500 380c30-16 50-42 56-74-26 6-46 26-56 50"/>
      <path d="M500 380c-30-16-50-42-56-74 26 6 46 26 56 50"/>
    </g>
    <!-- handle -->
    <path d="M768 452c56-6 92 22 92 52s-36 56-92 50" stroke-opacity=".3" stroke-width="6"/>
    <!-- saucer highlight -->
    <path d="M240 330a330 330 0 0 1 140-108" stroke-opacity=".28" stroke-width="4"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".85"/>
  <rect width="1000" height="1000" fill="none" stroke="#f3cad2" stroke-opacity=".06" stroke-width="2"/>
</svg>
