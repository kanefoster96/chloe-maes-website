<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2220"/><stop offset="100%" stop-color="#16110f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="#241c1a"/>
  <ellipse cx="500" cy="420" rx="330" ry="280" fill="#e0a94e" opacity=".22" filter="url(#soft)"/>
  <!-- table -->
  <rect y="700" width="1000" height="300" fill="#2f2523"/>
  <rect y="690" width="1000" height="16" fill="#3d302c"/>
  <!-- candle -->
  <rect x="466" y="466" width="68" height="230" rx="6" fill="#f3e7d6"/>
  <rect x="466" y="466" width="24" height="230" fill="#fff" opacity=".25"/>
  <path d="M500 452c-24-28-16-60 0-82 16 22 24 54 0 82z" fill="#e0a94e"/>
  <path d="M500 432c-12-16-8-34 0-46 8 12 12 30 0 46z" fill="#fff3d0"/>
  <!-- two glasses of wine -->
  <g fill="#f6efe6" opacity=".28">
    <path d="M250 380h150c0 84-40 126-75 130-35-4-75-46-75-130z"/>
    <path d="M600 380h150c0 84-40 126-75 130-35-4-75-46-75-130z"/>
  </g>
  <g fill="#8e2f45">
    <path d="M262 432h126c-8 56-38 82-63 86-25-4-55-30-63-86z"/>
    <path d="M612 432h126c-8 56-38 82-63 86-25-4-55-30-63-86z"/>
  </g>
  <g stroke="#f6efe6" stroke-opacity=".35" stroke-width="7" fill="none">
    <path d="M325 512v150M264 668h122M675 512v150M614 668h122"/>
  </g>
  <!-- a plate with something on it -->
  <ellipse cx="500" cy="806" rx="188" ry="62" fill="#000" opacity=".10" filter="url(#soft)"/><ellipse cx="500" cy="792" rx="180" ry="56" fill="#0f0b0a"/><ellipse cx="500" cy="792" rx="148" ry="44" fill="#fff" opacity=".06"/>
  <ellipse cx="500" cy="782" rx="104" ry="32" fill="#7a4a3a"/>
  <g fill="#8cc152" opacity=".85">
    <ellipse cx="470" cy="766" rx="26" ry="12" transform="rotate(-16 470 766)"/>
    <ellipse cx="528" cy="774" rx="26" ry="12" transform="rotate(12 528 774)"/>
  </g>
  <!-- cutlery glints -->
  <g fill="#8f8377" opacity=".55">
    <rect x="130" y="740" width="12" height="150" rx="6"/><rect x="866" y="740" width="12" height="150" rx="6"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
