<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="60%" stop-color="#f8f1ec"/>
      <stop offset="100%" stop-color="#f0e5dd"/>
    </radialGradient>
    <radialGradient id="glow" cx="26%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#edc3cb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#edc3cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="82%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#8fa887" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#8fa887" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <rect width="1000" height="1000" fill="url(#leaf)"/>
  <g stroke="#b05467" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- pendant lamps -->
    <g stroke-opacity=".45" stroke-width="4">
      <path d="M170 300v56M420 300v34M660 300v66M890 300v44"/>
    </g>
    <g fill="#241c1a" stroke="#241c1a" stroke-width="4" stroke-opacity=".9">
      <path d="M124 356h92a46 46 0 0 1-92 0z"/>
      <path d="M374 334h92a46 46 0 0 1-92 0z"/>
      <path d="M614 366h92a46 46 0 0 1-92 0z"/>
      <path d="M844 344h92a46 46 0 0 1-92 0z"/>
    </g>
    <g stroke="none" fill="#e0a24f" opacity=".3" filter="url(#soft)">
      <ellipse cx="170" cy="420" rx="72" ry="52"/><ellipse cx="420" cy="398" rx="72" ry="52"/>
      <ellipse cx="660" cy="430" rx="72" ry="52"/><ellipse cx="890" cy="408" rx="72" ry="52"/>
    </g>

    <!-- the flower wall behind the banquette -->
    <g stroke="none">
      <g fill="#43614a" opacity=".26">
        <ellipse cx="250" cy="520" rx="130" ry="62"/><ellipse cx="470" cy="500" rx="120" ry="56"/>
        <ellipse cx="690" cy="524" rx="128" ry="58"/><ellipse cx="880" cy="508" rx="110" ry="52"/>
      </g>
      <g opacity=".72">
        <circle cx="196" cy="500" r="20" fill="#edc3cb"/><circle cx="252" cy="536" r="15" fill="#b05467"/>
        <circle cx="312" cy="496" r="18" fill="#f6dde1"/><circle cx="404" cy="524" r="16" fill="#edc3cb"/>
        <circle cx="462" cy="486" r="21" fill="#b05467"/><circle cx="530" cy="522" r="14" fill="#f6dde1"/>
        <circle cx="628" cy="500" r="19" fill="#edc3cb"/><circle cx="700" cy="536" r="15" fill="#b05467"/>
        <circle cx="762" cy="498" r="17" fill="#f6dde1"/><circle cx="854" cy="520" r="18" fill="#edc3cb"/>
        <circle cx="918" cy="492" r="14" fill="#b05467"/>
      </g>
      <g fill="#8fa887" opacity=".6">
        <ellipse cx="228" cy="470" rx="9" ry="20" transform="rotate(-25 228 470)"/>
        <ellipse cx="360" cy="540" rx="9" ry="20" transform="rotate(20 360 540)"/>
        <ellipse cx="596" cy="474" rx="9" ry="20" transform="rotate(-18 596 474)"/>
        <ellipse cx="806" cy="546" rx="9" ry="20" transform="rotate(28 806 546)"/>
      </g>
    </g>

    <!-- banquette -->
    <path d="M120 596h760v40H120z" fill="#241c1a" stroke="none"/>
    <g stroke-opacity=".2" stroke-width="3"><path d="M280 596v-30M440 596v-30M600 596v-30M760 596v-30"/></g>

    <!-- marble table with two cups -->
    <rect x="300" y="656" width="400" height="16" rx="8" fill="#fffdfb" stroke="#b05467" stroke-opacity=".35" stroke-width="4"/>
    <g stroke-opacity=".55" stroke-width="5">
      <ellipse cx="412" cy="640" rx="40" ry="14" fill="#ffffff"/>
      <path d="M386 634c4 18 12 26 26 26s22-8 26-26"/>
      <ellipse cx="588" cy="640" rx="40" ry="14" fill="#ffffff"/>
      <path d="M562 634c4 18 12 26 26 26s22-8 26-26"/>
    </g>

    <!-- blush velvet chairs -->
    <g fill="#edc3cb" stroke="#b05467" stroke-opacity=".45" stroke-width="4">
      <path d="M170 700c0-52 26-84 62-84s62 32 62 84z"/>
      <path d="M706 700c0-52 26-84 62-84s62 32 62 84z"/>
    </g>
    <g stroke-opacity=".3" stroke-width="4"><path d="M170 700h124M706 700h124M232 700v70M768 700v70"/></g>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
