<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="60%" stop-color="#f8f1ec"/>
      <stop offset="100%" stop-color="#f0e5dd"/>
    </radialGradient>
    <radialGradient id="glow" cx="26%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#edc3cb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#edc3cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="82%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#8fa887" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#8fa887" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <rect width="1000" height="1000" fill="url(#leaf)"/>
  <g stroke="#b05467" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="500" cy="800" rx="330" ry="70" stroke-opacity=".22" stroke-width="3"/>
    <ellipse cx="500" cy="782" rx="268" ry="52" stroke-opacity=".14" stroke-width="2"/>
    <g stroke-width="6" stroke-opacity=".78">
      <path d="M262 700c0-46 106-76 238-76s238 30 238 76-106 76-238 76-238-30-238-76z" fill="#ffffff"/>
      <path d="M268 612c0-46 104-74 232-74s232 28 232 74-104 74-232 74-232-28-232-74z" fill="#fffdfb"/>
      <path d="M276 524c0-46 100-72 224-72s224 26 224 72-100 72-224 72-224-26-224-72z" fill="#fdf8f4"/>
    </g>
    <!-- the drip -->
    <path d="M292 470c30 42 62 66 96 74 8 40 4 66-10 78-16 14-34 2-32-18 2-16 16-30 42-42 60-28 118-14 176 8 44 16 82 20 114 8 20-8 34-24 42-48"
          stroke-opacity=".85" stroke-width="8"/>
    <path d="M700 522c4 34 0 56-12 66" stroke-opacity=".5" stroke-width="6"/>
    <!-- berries -->
    <circle cx="430" cy="432" r="34" fill="#edc3cb" fill-opacity=".5" stroke-opacity=".8" stroke-width="5"/>
    <path d="M430 398c-10-16-4-28 8-30 2 14-2 24-8 30" stroke-opacity=".7" stroke-width="4"/>
    <circle cx="524" cy="412" r="28" fill="#edc3cb" fill-opacity=".35" stroke-opacity=".7" stroke-width="5"/>
    <circle cx="600" cy="444" r="22" fill="#edc3cb" fill-opacity=".25" stroke-opacity=".6" stroke-width="5"/>
    <!-- dusting -->
    <g stroke-opacity=".5" stroke-width="5" stroke-linecap="round">
      <path d="M350 366h1M390 330h1M470 340h1M560 352h1M630 384h1M300 410h1M672 340h1"/>
    </g>
    <!-- steam -->
    <g stroke-opacity=".18" stroke-width="5">
      <path d="M448 280c-22-30 22-52 0-84M540 264c-22-30 22-52 0-84"/>
    </g>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
