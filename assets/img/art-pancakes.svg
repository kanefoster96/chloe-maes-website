<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6f7"/><stop offset="100%" stop-color="#f7e8ec"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect x="0" y="700" width="1000" height="300" fill="#ffffff"/><g stroke="#e4dcd6" stroke-width="3" fill="none" opacity=".8"><path d="M-20 770q160 40 300 6t420 22 320-30"/><path d="M-20 880q220-40 380 10t400-6 260 26"/><path d="M120 700q40 90 -10 180"/><path d="M760 720q60 80 20 170"/></g>
