    <ellipse cx="392" cy="392" rx="170" ry="134" fill="#f2ddb8"/>
    <ellipse cx="612" cy="632" rx="188" ry="150" fill="#e8c48a"/>
    <ellipse cx="612" cy="628" rx="170" ry="134" fill="#f2ddb8"/>
