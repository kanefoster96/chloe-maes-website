  <circle cx="624" cy="588" r="46" fill="#f4b73f"/>
  <circle cx="392" cy="340" r="16" fill="#f8cd6a" opacity=".8"/>
  <circle cx="612" cy="576" r="16" fill="#f8cd6a" opacity=".8"/>
