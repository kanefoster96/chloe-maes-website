<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf7f4"/><stop offset="100%" stop-color="#f4ebe4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="#efe9e3"/>
  <ellipse cx="500" cy="534" rx="388" ry="386" fill="#000" opacity=".10" filter="url(#soft)"/><ellipse cx="500" cy="520" rx="380" ry="380" fill="#3a2f2c"/>
  <ellipse cx="500" cy="520" rx="330" ry="330" fill="#241c1a"/>
  <!-- two flatbreads -->
