<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="60%" stop-color="#f8f1ec"/>
      <stop offset="100%" stop-color="#f0e5dd"/>
    </radialGradient>
    <radialGradient id="glow" cx="26%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#edc3cb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#edc3cb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="82%" cy="84%" r="55%">
      <stop offset="0%" stop-color="#8fa887" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#8fa887" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <rect width="1000" height="1000" fill="url(#leaf)"/>
  <g stroke="#b05467" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="500" cy="800" rx="340" ry="72" stroke-opacity=".2" stroke-width="3"/>
    <ellipse cx="500" cy="782" rx="276" ry="54" stroke-opacity=".12" stroke-width="2"/>
    <!-- slice -->
    <path d="M300 720L500 300l200 420z" fill="#fffdfb" stroke-opacity=".7" stroke-width="7"/>
    <g stroke-opacity=".45" stroke-width="6">
      <path d="M356 604h288M328 662h344"/>
    </g>
    <!-- cream layers -->
    <path d="M352 610c26-18 44 12 70-4s44 14 70-2 44 12 70-4 44 14 66-2" stroke-opacity=".7" stroke-width="7"/>
    <path d="M326 668c28-18 46 12 72-4s46 14 72-2 46 12 72-4 46 14 68-2" stroke-opacity=".7" stroke-width="7"/>
    <!-- top swirl -->
    <path d="M500 300c-34 26-42 66-14 84 30 20 74-8 62-46-8-24-30-32-48-38z" fill="#edc3cb" fill-opacity=".4" stroke-opacity=".75" stroke-width="6"/>
    <!-- cherry -->
    <circle cx="500" cy="252" r="34" fill="#edc3cb" fill-opacity=".55" stroke-opacity=".85" stroke-width="6"/>
    <path d="M500 218c8-34 30-48 56-46" stroke-opacity=".6" stroke-width="6"/>
    <!-- fork -->
    <g stroke-opacity=".28" stroke-width="6">
      <path d="M820 560v180M786 560v70c0 20 14 30 34 30M854 560v70c0 20-14 30-34 30"/>
      <path d="M820 740v120"/>
    </g>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
