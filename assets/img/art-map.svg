<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efe9"/><stop offset="100%" stop-color="#e9e3db"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="#f1ede7"/>
  <!-- the sea -->
  <path d="M760 0c-30 140-20 300 30 430 40 108 40 240 10 350-18 66-14 150 10 220h190V0z" fill="#cfe0e8"/>
  <!-- parks -->
  <rect x="60" y="620" width="230" height="180" rx="10" fill="#dae7d2"/>
  <rect x="330" y="120" width="180" height="140" rx="10" fill="#dae7d2"/>
  <!-- blocks -->
  <g fill="#e6e0d8">
    <rect x="80" y="300" width="200" height="220"/><rect x="330" y="300" width="220" height="220"/>
    <rect x="600" y="300" width="120" height="220"/><rect x="330" y="600" width="220" height="200"/>
    <rect x="600" y="600" width="120" height="200"/><rect x="80" y="100" width="200" height="140"/>
  </g>
  <!-- roads -->
  <g stroke="#fff" stroke-width="34" stroke-linecap="square">
    <path d="M0 270h740M0 560h740M0 840h740M310 0v1000M580 0v1000M50 0v1000"/>
  </g>
  <g stroke="#f2c9a0" stroke-width="18"><path d="M0 560h740"/></g>
  <!-- the metro line -->
  <g stroke="#8b8f96" stroke-width="7" stroke-dasharray="20 16"><path d="M660 0v1000"/></g>
  <!-- the pin -->
  <ellipse cx="580" cy="600" rx="86" ry="26" fill="#000" opacity=".14" filter="url(#soft)"/>
  <path d="M580 428c-58 0-105 47-105 105 0 74 105 172 105 172s105-98 105-172c0-58-47-105-105-105z" fill="#b05467"/>
  <circle cx="580" cy="533" r="38" fill="#fff"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
