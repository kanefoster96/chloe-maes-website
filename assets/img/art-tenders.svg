<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#241a1d"/>
      <stop offset="55%" stop-color="#171214"/>
      <stop offset="100%" stop-color="#0d0a0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c98793" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#c98793" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3cad2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#f3cad2" stop-opacity=".04"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g stroke="#f3cad2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bowl -->
    <path d="M180 520c0 176 143 319 320 319s320-143 320-319z" fill="#181214" stroke-opacity=".7" stroke-width="8"/>
    <ellipse cx="500" cy="520" rx="320" ry="86" fill="#1d1618" stroke-opacity=".8" stroke-width="8"/>
    <ellipse cx="500" cy="520" rx="262" ry="66" stroke-opacity=".2" stroke-width="4"/>
    <!-- tenders, glazed and piled -->
    <g stroke-width="7" stroke-opacity=".85">
      <path d="M330 500c-26-30-14-72 26-84 44-14 92 6 104 42 10 30-14 56-56 60-32 4-56-2-74-18z" fill="#251a1c"/>
      <path d="M500 470c-20-34 4-72 46-76 46-4 88 24 92 60 4 30-24 52-66 52-32 0-56-14-72-36z" fill="#251a1c"/>
      <path d="M416 420c-14-32 12-64 52-64 42 0 76 28 74 60-2 28-30 46-68 44-30-2-50-18-58-40z" fill="#2a1e21"/>
    </g>
    <!-- gochujang glaze -->
    <path d="M300 452c30 22 58 12 82 32 26 22 52 8 80 26 26 16 52 4 78 18 22 12 44 8 62-8"
          stroke-opacity=".55" stroke-width="9"/>
    <!-- sesame -->
    <g stroke-opacity=".7" stroke-width="6" stroke-linecap="round">
      <path d="M370 392h1M448 366h1M530 384h1M600 356h1M660 400h1M400 452h1M556 440h1"/>
    </g>
    <!-- spring onion -->
    <g stroke-opacity=".45" stroke-width="6">
      <path d="M338 350l40-18M602 322l38-16M690 372l36-14"/>
    </g>
    <!-- dip pot -->
    <ellipse cx="820" cy="700" rx="96" ry="30" stroke-opacity=".5" stroke-width="6"/>
    <path d="M724 700c0 46 44 78 96 78s96-32 96-78" stroke-opacity=".5" stroke-width="6"/>
    <ellipse cx="820" cy="700" rx="70" ry="20" fill="#c98793" fill-opacity=".4" stroke="none"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".85"/>
  <rect width="1000" height="1000" fill="none" stroke="#f3cad2" stroke-opacity=".06" stroke-width="2"/>
</svg>
